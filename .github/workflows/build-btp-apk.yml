name: Build and Test BTP APK

on:
  push:
    branches:
      - codex/btp-apk-builder
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btp-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore, verify and patch source archive
        shell: bash
        run: |
          cat .btp-build/source.part* > /tmp/controle-btp-project.b64
          test "$(wc -c < /tmp/controle-btp-project.b64)" = "60308"
          echo "ecf3dfa8f11ff1083814dfdb0e1fa967b4da88d223fd6a0b1c45386e741693d6  /tmp/controle-btp-project.b64" | sha256sum -c -
          base64 --decode /tmp/controle-btp-project.b64 > /tmp/controle-btp-project.tgz
          echo "240b60d7e03a0e92fbbba65cf7ffc1e731ea69e77748af33f5422c9a9e9260dc  /tmp/controle-btp-project.tgz" | sha256sum -c -
          mkdir -p generated dist
          tar -xzf /tmp/controle-btp-project.tgz -C generated --strip-components=1
          test -f generated/settings.gradle.kts
          test -f generated/app/build.gradle.kts
          python3 .btp-build/apply_fixes.py generated
          python3 .btp-build/apply_lint_fix.py generated

          test "$(wc -c < .btp-build/product-patch.gz.b64)" = "18152"
          echo "559353bf7d95902479990fa0375b0ab00ffeacfea51799bb17d1246b35cb31e5  .btp-build/product-patch.gz.b64" | sha256sum -c -
          base64 --decode .btp-build/product-patch.gz.b64 > /tmp/btp-product-fixes.patch.gz
          echo "627922fc0605e67ed4f0e1a60feae4a08f1a88276fe3b129f1d9dbeaa790b354  /tmp/btp-product-fixes.patch.gz" | sha256sum -c -
          gzip -dc /tmp/btp-product-fixes.patch.gz > /tmp/btp-product-fixes.patch
          echo "b77830adc3cf6527d4f557529f1032beb2ec920ae3ff46cd07df6de4f9198735  /tmp/btp-product-fixes.patch" | sha256sum -c -
          patch -p1 -d generated < /tmp/btp-product-fixes.patch
          python3 .btp-build/add_instrumentation_test.py generated

      - name: Unit tests, Android Lint and APKs
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace -p generated clean testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest 2>&1 | tee dist/build.log

      - name: Prepare deliverables
        if: success()
        shell: bash
        run: |
          cp generated/app/build/outputs/apk/debug/app-debug.apk dist/Controle-BTP-v1.0.0-debug.apk
          cp generated/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/Controle-BTP-v1.0.0-debug-androidTest.apk
          sha256sum dist/Controle-BTP-v1.0.0-debug.apk > dist/Controle-BTP-v1.0.0-debug.apk.sha256
          unzip -t dist/Controle-BTP-v1.0.0-debug.apk | tee dist/apk-structure-check.txt

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controle-btp-apk-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/**
            generated/app/build/reports/**
            generated/app/build/test-results/**

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: controle-btp-apk-${{ github.sha }}
          path: artifact

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and run the first-use flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            mkdir -p smoke
            adb install -r artifact/dist/Controle-BTP-v1.0.0-debug.apk
            adb install -r artifact/dist/Controle-BTP-v1.0.0-debug-androidTest.apk
            adb logcat -c
            adb shell pm list instrumentation | tee smoke/instrumentations.txt
            grep -q "fr.controlebtp.app.debug.test/androidx.test.runner.AndroidJUnitRunner" smoke/instrumentations.txt
            adb shell am instrument -w fr.controlebtp.app.debug.test/androidx.test.runner.AndroidJUnitRunner | tee smoke/instrumentation-result.txt
            grep -q "OK (1 test)" smoke/instrumentation-result.txt
            adb exec-out screencap -p > smoke/final-screen.png
            adb exec-out uiautomator dump /dev/tty > smoke/final-ui.xml
            grep -q "Préparer le contrôle" smoke/final-ui.xml
            adb logcat -d > smoke/logcat.txt
            ! grep -q "FATAL EXCEPTION" smoke/logcat.txt

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controle-btp-emulator-smoke-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: smoke/**
