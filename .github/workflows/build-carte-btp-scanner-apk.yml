name: Build Carte BTP Scanner APK

on:
  push:
    branches: ["build/carte-btp-scanner-apk"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore scanner project
        run: |
          rm -rf ci/scanner-src ci/scanner-buildsrc.tar.xz
          cat ci/carte-btp-scanner.part* | base64 --decode > ci/scanner-buildsrc.tar.xz
          mkdir -p ci/scanner-src
          tar -xJf ci/scanner-buildsrc.tar.xz -C ci/scanner-src
          test -f ci/scanner-src/settings.gradle.kts
          sed -i 's/Scanner\.FieldRow/ScannerFieldRow/g' ci/scanner-src/app/src/main/res/values/styles.xml ci/scanner-src/app/src/main/res/layout/activity_scanner.xml
      - name: Test and build APK
        working-directory: ci/scanner-src
        run: gradle --no-daemon --stacktrace :core:test :app:assembleDebug
      - name: Verify APK
        run: |
          APK="ci/scanner-src/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK" | tee ci/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: carte-btp-scanner-debug-apk
          path: |
            ci/scanner-src/app/build/outputs/apk/debug/app-debug.apk
            ci/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
